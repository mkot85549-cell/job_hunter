# Alembic Configuration
# Файл: alembic.ini

[alembic]
# Путь к скриптам миграций
script_location = migrations
prepend_sys_path = .

# Шаблон имени файлов миграций: timestamp_slug.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Часовой пояс для timestamp (UTC — стандарт)
timezone = UTC

# sqlalchemy.url берётся динамически из env.py (через DATABASE_URL из .env),
# поэтому здесь оставляем пустым:
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
