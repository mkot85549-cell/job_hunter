[project]
name = "backend-app"
version = "0.1.0"
description = "Async Python backend template"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "aiogram>=3.15.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

# ==========================================
# Настройки pytest и pytest-asyncio
# ==========================================
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: тесты, требующие реального подключения к PostgreSQL",
]

# ==========================================
# Настройки линтера и форматтера Ruff
# ==========================================
[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations/versions", # Автосгенерированные файлы Alembic не линтим
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle (ошибки PEP 8)
    "W",     # pycodestyle (предупреждения PEP 8)
    "F",     # pyflakes (неиспользуемые импорты и переменные)
    "I",     # isort (сортировка импортов по алфавиту и группам)
    "B",     # flake8-bugbear (поиск частых багов и антипаттернов)
    "C4",    # flake8-comprehensions (оптимизация списковых включений)
    "UP",    # pyupgrade (требование современного синтаксиса Python 3.14)
    "ANN",   # flake8-annotations (требование type hints везде)
    "ASYNC", # flake8-async (проверка ошибок в async/await коде)
    "S",     # flake8-bandit (проверка безопасности: SQL-инъекции, хардкод паролей)
    "SIM",   # flake8-simplify (упрощение сложных конструкций if/else)
    "RUF",   # собственные правила Ruff
]
ignore = [
    "ANN401", # Разрешаем typing.Any там, где без него не обойтись (например, в декораторах)
    "RUF001", # Разрешаем кириллицу в строках
    "RUF002", # Разрешаем кириллицу в docstrings
    "RUF003", # Разрешаем кириллицу в комментариях
]

[tool.ruff.lint.per-file-ignores]
# В тестах разрешаем использовать оператор assert (S101) и хардкодить тестовые токены (S105, S106)
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"